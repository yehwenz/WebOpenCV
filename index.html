<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>雙平台鏡片正反面 AOI 檢測系統</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      margin: 0;
      padding: 10px;
    }
    .container {
      position: relative;
      display: inline-block;
      width: 100%;
      max-width: 640px;
    }
    video {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0.01;
      pointer-events: none;
      z-index: -1;
    }
    canvas {
      width: 100%;
      height: auto;
      background-color: #000;
      border-radius: 8px;
    }
    #status {
      margin: 10px 0;
      padding: 8px;
      background-color: #222;
      border-radius: 6px;
      font-size: 15px;
    }
    .btn {
      background-color: #007aff;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 10px;
    }
  </style>
  <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>
</head>
<body>

  <h2>鏡片正反面比對系統</h2>
  <button id="startBtn" class="btn" disabled onclick="initCamera()">正在載入引擎...</button>
  <div id="status">等待 OpenCV.js 載入...</div>

  <div class="container">
    <video id="videoInput" playsinline autoplay muted></video>
    <canvas id="canvasOutput"></canvas>
  </div>

  <script type="text/javascript">
    const video = document.getElementById('videoInput');
    const canvas = document.getElementById('canvasOutput');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    
    let streaming = false;
    let isOpenCvReady = false;

    function onOpenCvReady() {
      isOpenCvReady = true;
      status.innerText = '引擎已就緒，請開啟鏡頭';
      startBtn.innerText = '開啟鏡頭';
      startBtn.disabled = false;
    }

    async function initCamera() {
      if (!isOpenCvReady) return;
      startBtn.disabled = true;

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });
        video.srcObject = stream;
        video.muted = true;
        await video.play();
        video.addEventListener('loadedmetadata', onVideoReady);
      } catch (err) {
        status.innerText = '無法存取相機: ' + err.message;
        startBtn.disabled = false;
      }
    }

    function onVideoReady() {
      if (streaming) return;
      if (video.videoWidth > 0 && video.videoHeight > 0) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        streaming = true;
        status.innerText = '請將 [OK樣品] 放左邊，[待測品] 放右邊';
        startBtn.style.display = 'none';
        requestAnimationFrame(processVideo);
      } else {
        setTimeout(onVideoReady, 100);
      }
    }

    // 計算指定 ROI 區域內斜線的角度
    function detectAngle(srcMat, roiRect) {
      let roi = srcMat.roi(roiRect);
      let gray = new cv.Mat();
      let edges = new cv.Mat();
      let lines = new cv.Mat();

      cv.cvtColor(roi, gray, cv.COLOR_RGBA2GRAY, 0);
      cv.Canny(gray, edges, 50, 150, 3, false);
      
      // 霍夫線變換：尋找長條特徵線
      cv.HoughLinesP(edges, lines, 1, Math.PI / 180, 40, 30, 10);

      let totalAngle = 0;
      let lineCount = 0;

      for (let i = 0; i < lines.rows; ++i) {
        let x1 = lines.data32S[i * 4];
        let y1 = lines.data32S[i * 4 + 1];
        let x2 = lines.data32S[i * 4 + 2];
        let y2 = lines.data32S[i * 4 + 3];

        let angle = Math.atan2(y2 - y1, x2 - x1) * (180 / Math.PI);
        
        // 篩選非水平/非垂直的斜線角度
        if (Math.abs(angle) > 20 && Math.abs(angle) < 160) {
          totalAngle += angle;
          lineCount++;
        }
      }

      let avgAngle = lineCount > 0 ? totalAngle / lineCount : null;

      roi.delete(); gray.delete(); edges.delete(); lines.delete();
      return avgAngle;
    }

    function processVideo() {
      if (!streaming) return;

      let src = new cv.Mat(video.videoHeight, video.videoWidth, cv.CV_8UC4);

      try {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        src.data.set(imageData.data);

        // 劃分左右兩個檢測區域 (ROI)
        let w = canvas.width;
        let h = canvas.height;
        let roiWidth = Math.floor(w * 0.4);
        let roiHeight = Math.floor(h * 0.6);
        let roiY = Math.floor((h - roiHeight) / 2);

        let leftRoiRect = new cv.Rect(Math.floor(w * 0.08), roiY, roiWidth, roiHeight);  // 左邊: 參考物 (OK)
        let rightRoiRect = new cv.Rect(Math.floor(w * 0.52), roiY, roiWidth, roiHeight); // 右邊: 待測物

        // 分別計算兩邊的角度
        let leftAngle = detectAngle(src, leftRoiRect);
        let rightAngle = detectAngle(src, rightRoiRect);

        // 先渲染相機原圖
        cv.imshow('canvasOutput', src);

        // 畫出左右 ROI 檢測框
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#00FFFF'; // 藍綠色框
        ctx.strokeRect(leftRoiRect.x, leftRoiRect.y, leftRoiRect.width, leftRoiRect.height);
        ctx.strokeRect(rightRoiRect.x, rightRoiRect.y, rightRoiRect.width, rightRoiRect.height);

        ctx.fillStyle = '#00FFFF';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText('左: OK 參考物', leftRoiRect.x + 10, leftRoiRect.y + 25);
        ctx.fillText('右: 待測物', rightRoiRect.x + 10, rightRoiRect.y + 25);

        // 比對判定
        if (leftAngle !== null && rightAngle !== null) {
          // 計算角度差
          let angleDiff = Math.abs(leftAngle - rightAngle);
          
          // 若角度方向一致 (角度差小於 30 度) 為 PASS，否則為 FAIL
          let isPass = angleDiff < 30 || angleDiff > 150; 

          ctx.font = 'bold 48px sans-serif';
          if (isPass) {
            ctx.fillStyle = '#00FF00';
            ctx.fillText('PASS (正常)', w / 2 - 120, 80);
          } else {
            ctx.fillStyle = '#FF0000';
            ctx.fillText('NG (裝反)', w / 2 - 100, 80);
          }
        } else {
          ctx.fillStyle = '#FFFF00';
          ctx.font = '20px sans-serif';
          ctx.fillText('對焦中...請將鏡片置於框內', w / 2 - 120, 50);
        }

      } catch (err) {
        console.error(err);
      } finally {
        src.delete();
      }

      requestAnimationFrame(processVideo);
    }
  </script>
</body>
</html>
